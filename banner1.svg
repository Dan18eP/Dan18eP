<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Laptop Screen Glow -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Ambient backdrop behind dev -->
    <radialGradient id="dev-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="2" y="2" width="956" height="286" rx="10" fill="url(#term-bg)" stroke="#30363d" stroke-width="1.5" />

  <!-- Terminal Header -->
  <rect x="2" y="2" width="956" height="36" rx="10" fill="#13171f" />
  <rect x="2" y="26" width="956" height="12" fill="#13171f" />
  <line x1="2" y1="38" x2="958" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Controls -->
  <circle cx="24" cy="20" r="5" fill="#ff5f56" />
  <circle cx="40" cy="20" r="5" fill="#ffbd2e" />
  <circle cx="56" cy="20" r="5" fill="#27c93f" />

  <!-- Title -->
  <text x="360" y="24" font-family="Consolas, monospace" font-size="12" fill="#8b949e" text-anchor="middle">daniel@backend-node: ~/core (python3.12)</text>

  <!-- Left Side: Terminal Output Lines -->
  <!-- Line 1 -->
  <g font-family="Consolas, monospace" font-size="13.5">
    <text x="30" y="70" fill="#50fa7b" font-weight="bold">dan@dev:~$</text>
    <text x="125" y="70" fill="#f1fa8c">python -m engine.whoami</text>
  </g>

  <!-- Line 2: Name & Role -->
  <g transform="translate(30, 110)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" letter-spacing="0.5">DANIEL ECHEVERRÍA</text>
    <text x="305" y="-2" font-family="Consolas, monospace" font-size="13" fill="#38bdf8" font-weight="bold">:: BACKEND DEVELOPER AND SYSTEMS ENGINEER STUDENT</text>
  </g>

  <!-- Line 3: Pillars -->
  <g font-family="Consolas, monospace" font-size="12" transform="translate(30, 142)">
    <text x="0" y="0" fill="#8b949e">&gt; Scalable Architectures</text>
    <text x="175" y="0" fill="#4b5563">|</text>
    <text x="190" y="0" fill="#8b949e">High-Performance APIs</text>
    <text x="360" y="0" fill="#4b5563">|</text>
    <text x="375" y="0" fill="#8b949e">AI Pipelines</text>
  </g>

  <!-- Line 4: Stack -->
  <g font-family="Consolas, monospace" font-size="12" transform="translate(30, 178)">
    <text x="0" y="0" fill="#6e7681">STACK :</text>
    <text x="60" y="0" fill="#38bdf8" font-weight="bold">Python</text>
    <text x="110" y="0" fill="#6e7681">(</text>
    <text x="118" y="0" fill="#f8fafc">FastAPI, Flask, Pydantic, SQLAlchemy</text>
    <text x="390" y="0" fill="#6e7681">)</text>
    <text x="405" y="0" fill="#4b5563">•</text>
    <text x="420" y="0" fill="#a78bfa" font-weight="bold">PostgreSQL</text>
    <text x="505" y="0" fill="#4b5563">•</text>
    <text x="520" y="0" fill="#34d399" font-weight="bold">Docker</text>
  </g>

  <!-- Line 5: Infra & Support -->
  <g font-family="Consolas, monospace" font-size="12" transform="translate(30, 210)">
    <text x="0" y="0" fill="#6e7681">INFRA :</text>
    <text x="60" y="0" fill="#fbbf24">AI Agents (LangChain/LangGraph/RAG)</text>
    <text x="270" y="0" fill="#4b5563">•</text>
    <text x="325" y="0" fill="#94a3b8"> Next.js / React / TypeScript Support</text>
  </g>

  <!-- Line 6: Interactive Terminal Status & Native SMIL Blinking Cursor -->
  <g font-family="Consolas, monospace" font-size="13" transform="translate(30, 248)">
    <text x="0" y="0" fill="#50fa7b" font-weight="bold">dan@dev:~$</text>
    <text x="90" y="0" fill="#f8fafc">status --all</text>
    <text x="195" y="0" fill="#6e7681">[System Online - Ready]</text>
    <rect x="370" y="-12" width="8" height="15" fill="#50fa7b">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>